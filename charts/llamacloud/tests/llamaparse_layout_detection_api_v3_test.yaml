suite: llamaparse-layout-detection-api-v3-tests

templates:
- ../templates/llamacloud/deployment.yaml

release:
  name: test-release
  namespace: test-namespace

tests:
- it: should be a Deployment with GPU resources when config.parseLayoutDetectionV3.gpu is true
  set:
    config:
      frontend:
        enabled: false
      parseLayoutDetectionV3:
        enabled: true
        gpu: true
    redis:
      host: test-redis
      port: "6379"
      password: test-pass
    postgresql:
      host: test-pg
      port: "5432"
      username: test-user
      password: test-pass
      database: test-db
    mongodb:
      host: mongodb
      username: test-mongo-user
      password: test-mongo-pass
    rabbitmq:
      host: test-rabbit
      username: test-user
      password: test-pass
  template: ../templates/llamacloud/deployment.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud-layout-v3
  asserts:
    - isKind:
        of: Deployment
    - equal:
        path: spec.template.spec.containers[0].name
        value: llamacloud-layout-v3
    - equal:
        path: spec.template.spec.containers[0].resources.requests["nvidia.com/gpu"]
        value: 1
    - equal:
        path: spec.template.spec.containers[0].resources.limits["nvidia.com/gpu"]
        value: 1

- it: should not render GPU resources when config.parseLayoutDetectionV3.gpu is false
  set:
    config:
      frontend:
        enabled: false
      parseLayoutDetectionV3:
        enabled: true
        gpu: false
    redis:
      host: test-redis
      port: "6379"
      password: test-pass
    postgresql:
      host: test-pg
      port: "5432"
      username: test-user
      password: test-pass
      database: test-db
    mongodb:
      host: mongodb
      username: test-mongo-user
      password: test-mongo-pass
    rabbitmq:
      host: test-rabbit
      username: test-user
      password: test-pass
  template: ../templates/llamacloud/deployment.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud-layout-v3
  asserts:
    - notExists:
        path: spec.template.spec.containers[0].resources.requests["nvidia.com/gpu"]
    - notExists:
        path: spec.template.spec.containers[0].resources.limits["nvidia.com/gpu"]

- it: should render custom GPU count when config.parseLayoutDetectionV3.gpu is true
  set:
    config:
      frontend:
        enabled: false
      parseLayoutDetectionV3:
        enabled: true
        gpu: true
    llamaParseLayoutDetectionApiV3:
      gpuCount: 2
    redis:
      host: test-redis
      port: "6379"
      password: test-pass
    postgresql:
      host: test-pg
      port: "5432"
      username: test-user
      password: test-pass
      database: test-db
    mongodb:
      host: mongodb
      username: test-mongo-user
      password: test-mongo-pass
    rabbitmq:
      host: test-rabbit
      username: test-user
      password: test-pass
  template: ../templates/llamacloud/deployment.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud-layout-v3
  asserts:
    - equal:
        path: spec.template.spec.containers[0].resources.requests["nvidia.com/gpu"]
        value: 2
    - equal:
        path: spec.template.spec.containers[0].resources.limits["nvidia.com/gpu"]
        value: 2

- it: should render custom GPU resource name when config.parseLayoutDetectionV3.gpu is true
  set:
    config:
      frontend:
        enabled: false
      parseLayoutDetectionV3:
        enabled: true
        gpu: true
    llamaParseLayoutDetectionApiV3:
      gpuResourceName: example.com/gpu
    redis:
      host: test-redis
      port: "6379"
      password: test-pass
    postgresql:
      host: test-pg
      port: "5432"
      username: test-user
      password: test-pass
      database: test-db
    mongodb:
      host: mongodb
      username: test-mongo-user
      password: test-mongo-pass
    rabbitmq:
      host: test-rabbit
      username: test-user
      password: test-pass
  template: ../templates/llamacloud/deployment.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud-layout-v3
  asserts:
    - equal:
        path: spec.template.spec.containers[0].resources.requests["example.com/gpu"]
        value: 1
    - equal:
        path: spec.template.spec.containers[0].resources.limits["example.com/gpu"]
        value: 1

- it: should keep custom layout image unsuffixed in GPU mode
  set:
    config:
      frontend:
        enabled: false
      parseLayoutDetectionV3:
        enabled: true
        gpu: true
    llamaParseLayoutDetectionApiV3:
      image: example.com/layout-v3:triton-dev
    redis:
      host: test-redis
      port: "6379"
      password: test-pass
    postgresql:
      host: test-pg
      port: "5432"
      username: test-user
      password: test-pass
      database: test-db
    mongodb:
      host: mongodb
      username: test-mongo-user
      password: test-mongo-pass
    rabbitmq:
      host: test-rabbit
      username: test-user
      password: test-pass
  template: ../templates/llamacloud/deployment.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud-layout-v3
  asserts:
    - equal:
        path: spec.template.spec.containers[0].image
        value: example.com/layout-v3:triton-dev
