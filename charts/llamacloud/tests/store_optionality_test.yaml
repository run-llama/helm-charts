suite: store-optionality-tests

# MongoDB remains optional. The chart renders no RabbitMQ credentials or AMQP
# flag, and the schema rejects `rabbitmq` values.

templates:
- ../templates/llamacloud/configmaps/common.yaml
- ../templates/llamacloud/deployment.yaml

release:
  name: test-release
  namespace: test-namespace

capabilities:
  majorVersion: 1
  minorVersion: 31
  apiVersions:
    - apps/v1

chart:
  appVersion: 0.0.0

tests:
# ---------------------------------------------------------------------------
# Default state: no flag envs, secrets mounted, no AMQP consumer
# ---------------------------------------------------------------------------
- it: default values inject no disable flags into common-config
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - notExists:
        path: .data.MONGO_DISABLED
    - notExists:
        path: .data.AMQP_DISABLED
    - notExists:
        path: .data.V1_ENABLED

- it: backend mounts mongodb but no rabbitmq secret by default
  template: ../templates/llamacloud/deployment.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud
  asserts:
    - contains:
        path: spec.template.spec.containers[0].envFrom
        content:
          secretRef:
            name: mongodb-secret
    - notContains:
        path: spec.template.spec.containers[0].envFrom
        content:
          secretRef:
            name: rabbitmq-secret

- it: jobs-worker Deployment is absent by default
  template: ../templates/llamacloud/deployment.yaml
  asserts:
    - not: true
      containsDocument:
        any: true
        kind: Deployment
        apiVersion: apps/v1
        name: llamacloud-worker
        namespace: test-namespace

# ---------------------------------------------------------------------------
# mongodb.enabled=false
# ---------------------------------------------------------------------------
- it: mongodb disabled injects MONGO_DISABLED into common-config
  set:
    mongodb.enabled: false
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - equal:
        path: .data.MONGO_DISABLED
        value: "true"
    - notExists:
        path: .data.AMQP_DISABLED

- it: mongodb disabled removes the mongodb envFrom ref from every Deployment
  set:
    mongodb.enabled: false
  template: ../templates/llamacloud/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
    matchMany: true
  asserts:
    - notContains:
        path: spec.template.spec.containers[0].envFrom
        content:
          secretRef:
            name: mongodb-secret

- it: mongodb disabled does not restore rabbitmq credentials
  set:
    mongodb.enabled: false
  template: ../templates/llamacloud/deployment.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud
  asserts:
    - notContains:
        path: spec.template.spec.containers[0].envFrom
        content:
          secretRef:
            name: rabbitmq-secret

- it: mongodb disabled still renders the jobs-service and temporal-jobs-worker Deployments
  set:
    mongodb.enabled: false
  template: ../templates/llamacloud/deployment.yaml
  asserts:
    - containsDocument:
        any: true
        kind: Deployment
        apiVersion: apps/v1
        name: llamacloud-operator
        namespace: test-namespace
    - containsDocument:
        any: true
        kind: Deployment
        apiVersion: apps/v1
        name: temporal-jobs-worker
        namespace: test-namespace

# ---------------------------------------------------------------------------
# Retired RabbitMQ resources
# ---------------------------------------------------------------------------
- it: does not inject the retired AMQP flag
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - notExists:
        path: .data.AMQP_DISABLED
    - notExists:
        path: .data.MONGO_DISABLED

- it: omits RabbitMQ credentials from every Deployment
  template: ../templates/llamacloud/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
    matchMany: true
  asserts:
    - notContains:
        path: spec.template.spec.containers[0].envFrom
        content:
          secretRef:
            name: rabbitmq-secret

- it: omits the retired jobs-worker Deployment
  template: ../templates/llamacloud/deployment.yaml
  asserts:
    - not: true
      containsDocument:
        any: true
        kind: Deployment
        apiVersion: apps/v1
        name: llamacloud-worker
        namespace: test-namespace

# ---------------------------------------------------------------------------
# Both disabled (the parse+extract-only minimal shape)
# ---------------------------------------------------------------------------
- it: both stores disabled only injects the MongoDB flag
  set:
    mongodb.enabled: false
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - equal:
        path: .data.MONGO_DISABLED
        value: "true"
    - notExists:
        path: .data.AMQP_DISABLED

- it: both stores disabled keeps backend and temporal workers running
  set:
    mongodb.enabled: false
  template: ../templates/llamacloud/deployment.yaml
  asserts:
    - containsDocument:
        any: true
        kind: Deployment
        apiVersion: apps/v1
        name: llamacloud
        namespace: test-namespace
    - containsDocument:
        any: true
        kind: Deployment
        apiVersion: apps/v1
        name: llamacloud-temporal-parse
        namespace: test-namespace
    - containsDocument:
        any: true
        kind: Deployment
        apiVersion: apps/v1
        name: temporal-jobs-worker
        namespace: test-namespace

- it: both stores disabled leaves no secretRef to either store anywhere
  set:
    mongodb.enabled: false
  template: ../templates/llamacloud/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
    matchMany: true
  asserts:
    - notContains:
        path: spec.template.spec.containers[0].envFrom
        content:
          secretRef:
            name: mongodb-secret
    - notContains:
        path: spec.template.spec.containers[0].envFrom
        content:
          secretRef:
            name: rabbitmq-secret

# ---------------------------------------------------------------------------
# config.v1.enabled=false — V1_ENABLED product switch (independent of stores):
# a backend runtime flag, so it injects V1_ENABLED=false but does NOT change
# chart topology.
# ---------------------------------------------------------------------------
- it: v1 disabled injects V1_ENABLED=false and touches no store flags
  set:
    config.v1.enabled: false
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - equal:
        path: .data.V1_ENABLED
        value: "false"
    - notExists:
        path: .data.MONGO_DISABLED
    - notExists:
        path: .data.AMQP_DISABLED

- it: v1 disabled does not restore the removed jobs-worker Deployment
  set:
    config.v1.enabled: false
  template: ../templates/llamacloud/deployment.yaml
  asserts:
    - not: true
      containsDocument:
        any: true
        kind: Deployment
        apiVersion: apps/v1
        name: llamacloud-worker
        namespace: test-namespace
