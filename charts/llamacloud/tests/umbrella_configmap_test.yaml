suite: umbrella-configmap-tests

# Covers templates/llamacloud/configmap.yaml, which iterates over all components
# in `llamacloud.components` and renders a ConfigMap for each whose `.configMap`
# helper returns non-empty content.

templates:
- ../templates/llamacloud/configmap.yaml

release:
  name: test-release
  namespace: test-namespace

capabilities:
  majorVersion: 1
  minorVersion: 31
  apiVersions:
    - v1

chart:
  appVersion: 0.0.0

tests:
- it: renders one ConfigMap per component whose .configMap helper is non-empty
  # Default set of components with non-empty .configMap helpers:
  # frontend (enabled by default),
  # temporal.llamaParse, and one temporal worker (first entry in temporalWorkloads.workers).
  template: ../templates/llamacloud/configmap.yaml
  asserts:
    - hasDocuments:
        count: 3

- it: renders the frontend ConfigMap with HOSTNAME and feature defaults
  template: ../templates/llamacloud/configmap.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud-web
  asserts:
    - isKind:
        of: ConfigMap
    - equal:
        path: .data.HOSTNAME
        value: "0.0.0.0"
    - equal:
        path: .data.IS_INDEX_V1_ENABLED
        value: "true"
    - equal:
        path: .data.WELCOME_PAGE_MANUAL_SETUP
        value: "true"
    - isNull:
        path: .data.BYOC_HAS_MANAGED_QDRANT

- it: frontend ConfigMap exposes BYOC_HAS_MANAGED_QDRANT when qdrant is enabled
  set:
    qdrant:
      enabled: true
      url: https://qdrant.example.com
      apiKey: abc
  template: ../templates/llamacloud/configmap.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud-web
  asserts:
    - equal:
        path: .data.BYOC_HAS_MANAGED_QDRANT
        value: "true"
    # The build-time NEXT_PUBLIC_ variant is gone: it was baked into the client
    # bundle at image build, so a per-deployment ConfigMap value never applied.
    - isNull:
        path: .data.NEXT_PUBLIC_BYOC_HAS_MANAGED_QDRANT

- it: frontend ConfigMap leaves connect-src open when storage origins are unknown
  template: ../templates/llamacloud/configmap.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud-web
  asserts:
    - equal:
        path: .data.CSP_ENFORCE_CONNECT_SRC
        value: "false"

- it: frontend ConfigMap enforces connect-src when presigned URLs go through s3proxy on the ingress host
  set:
    ingress:
      host: llamacloud.example.com
    config:
      storageBuckets:
        s3proxy:
          enabled: true
  template: ../templates/llamacloud/configmap.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud-web
  asserts:
    - equal:
        path: .data.CSP_ENFORCE_CONNECT_SRC
        value: "true"

# Without ingress.host the frontend has no PUBLIC_BACKEND_URL, so it cannot allow
# the host the s3-proxy URLs point at.
- it: frontend ConfigMap leaves connect-src open for s3proxy without an ingress host
  set:
    config:
      storageBuckets:
        s3proxy:
          enabled: true
  template: ../templates/llamacloud/configmap.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud-web
  asserts:
    - equal:
        path: .data.CSP_ENFORCE_CONNECT_SRC
        value: "false"

- it: frontend ConfigMap ignores storage origins the frontend would drop
  set:
    config:
      frontend:
        storageBrowserOrigins: " s3://llama-platform-raw-files , "
  template: ../templates/llamacloud/configmap.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud-web
  asserts:
    - equal:
        path: .data.CSP_ENFORCE_CONNECT_SRC
        value: "false"

- it: frontend ConfigMap counts a scheme-less storage origin, which the frontend reads as https
  set:
    config:
      frontend:
        storageBrowserOrigins: bucket.s3.amazonaws.com
  template: ../templates/llamacloud/configmap.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud-web
  asserts:
    - equal:
        path: .data.CSP_ENFORCE_CONNECT_SRC
        value: "true"

- it: frontend ConfigMap enforces connect-src when storage origins are listed
  set:
    config:
      frontend:
        storageBrowserOrigins: https://bucket.s3.amazonaws.com
  template: ../templates/llamacloud/configmap.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud-web
  asserts:
    - equal:
        path: .data.CSP_ENFORCE_CONNECT_SRC
        value: "true"

- it: frontend ConfigMap lets enforceConnectSrc override the derived value
  set:
    config:
      frontend:
        storageBrowserOrigins: https://bucket.s3.amazonaws.com
        enforceConnectSrc: false
  template: ../templates/llamacloud/configmap.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud-web
  asserts:
    - equal:
        path: .data.CSP_ENFORCE_CONNECT_SRC
        value: "false"

- it: frontend ConfigMap enforces connect-src when enforceConnectSrc is set on its own
  set:
    config:
      frontend:
        enforceConnectSrc: true
  template: ../templates/llamacloud/configmap.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud-web
  asserts:
    - equal:
        path: .data.CSP_ENFORCE_CONNECT_SRC
        value: "true"

- it: frontend ConfigMap is not rendered when frontend is disabled
  set:
    config:
      frontend:
        enabled: false
  template: ../templates/llamacloud/configmap.yaml
  asserts:
    # 2 remaining: temporal.llamaParse and one temporal worker.
    # The missing one is llamacloud-web (frontend); count alone validates absence.
    - hasDocuments:
        count: 2

- it: renders temporal Parse ConfigMap with defaults
  template: ../templates/llamacloud/configmap.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud-temporal-parse
  asserts:
    - equal:
        path: .data.DEBUG_MODE
        value: "false"
    - isNull:
        path: .data.PREFERED_PREMIUM_MODE_MODEL
    - equal:
        path: .data.LLAMAPARSE_DO_NOT_RETIRE_LEGACY_TIER_VERSIONS
        value: "true"

- it: temporal Parse ConfigMap exposes PREFERED_PREMIUM_MODE_MODEL when set
  set:
    config:
      parse:
        preferedPremiumModel: openai-gpt-4o
  template: ../templates/llamacloud/configmap.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud-temporal-parse
  asserts:
    - equal:
        path: .data.PREFERED_PREMIUM_MODE_MODEL
        value: openai-gpt-4o

- it: temporal-jobs-worker ConfigMap renders the pipeline concurrency default
  template: ../templates/llamacloud/configmap.yaml
  documentSelector:
    path: metadata.name
    value: temporal-jobs-worker
  asserts:
    - equal:
        path: .data.MAX_INDEX_JOBS_IN_EXECUTION
        value: "100000"

- it: temporal-jobs-worker ConfigMap applies the pipeline concurrency override
  set:
    config:
      jobs:
        maxIndexJobsInExecution: 4
  template: ../templates/llamacloud/configmap.yaml
  documentSelector:
    path: metadata.name
    value: temporal-jobs-worker
  asserts:
    - equal:
        path: .data.MAX_INDEX_JOBS_IN_EXECUTION
        value: "4"

- it: temporal-jobs-worker ConfigMap renders default cleanup retention envs
  template: ../templates/llamacloud/configmap.yaml
  documentSelector:
    path: metadata.name
    value: temporal-jobs-worker
  asserts:
    - equal:
        path: .data.CLEANUP_PARSE_V2_RETENTION_DAYS
        value: "30"
    - equal:
        path: .data.CLEANUP_EXTRACT_V2_RETENTION_DAYS
        value: "14"
    - equal:
        path: .data.CLEANUP_CLASSIFY_V2_RETENTION_DAYS
        value: "14"

- it: explicit retentionDays=0 passes through (disables cleanup, does not fall back to default)
  set:
    config:
      jobCleanup:
        parse:
          retentionDays: 0
        extract:
          retentionDays: 0
        classify:
          retentionDays: 0
  template: ../templates/llamacloud/configmap.yaml
  documentSelector:
    path: metadata.name
    value: temporal-jobs-worker
  asserts:
    - equal:
        path: .data.CLEANUP_PARSE_V2_RETENTION_DAYS
        value: "0"
    - equal:
        path: .data.CLEANUP_EXTRACT_V2_RETENTION_DAYS
        value: "0"
    - equal:
        path: .data.CLEANUP_CLASSIFY_V2_RETENTION_DAYS
        value: "0"

- it: positive override propagates to cleanup retention envs
  set:
    config:
      jobCleanup:
        parse:
          retentionDays: 90
  template: ../templates/llamacloud/configmap.yaml
  documentSelector:
    path: metadata.name
    value: temporal-jobs-worker
  asserts:
    - equal:
        path: .data.CLEANUP_PARSE_V2_RETENTION_DAYS
        value: "90"
