suite: profile-preset-tests

# examples/profiles/{minimal,no-rabbitmq,full}.yaml are preset overlays. minimal =
# parse+extract-only (no mongo, no rabbit, v1 parse worker scaled to 0, index
# destination pinned to postgres). no-rabbitmq = the RabbitMQ half of minimal,
# for deployments decommissioning AMQP while keeping MongoDB. full = every store
# on (identical to no overlay). These tests assert the presets resolve to the
# intended shape; store-optionality mechanics themselves are covered by
# store_optionality_test.

templates:
- ../templates/llamacloud/configmaps/common.yaml
- ../templates/llamacloud/configmaps/features.yaml
- ../templates/llamacloud/deployment.yaml

release:
  name: test-release
  namespace: test-namespace

capabilities:
  majorVersion: 1
  minorVersion: 31
  apiVersions:
    - apps/v1

chart:
  appVersion: 0.0.0

tests:
# ---------------------------------------------------------------------------
# minimal.yaml
# ---------------------------------------------------------------------------
- it: minimal preset disables both stores
  values:
    - ../examples/profiles/minimal.yaml
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - equal:
        path: .data.MONGO_DISABLED
        value: "true"
    - equal:
        path: .data.AMQP_DISABLED
        value: "true"

- it: minimal preset pins default index destination to postgres
  values:
    - ../examples/profiles/minimal.yaml
  template: ../templates/llamacloud/configmaps/features.yaml
  asserts:
    - equal:
        path: .data.DEFAULT_DIRECTORY_INDEX_DESTINATION
        value: postgres

- it: minimal preset scales the v1 parse worker to zero
  values:
    - ../examples/profiles/minimal.yaml
  template: ../templates/llamacloud/deployment.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud-parse
  asserts:
    - equal:
        path: spec.replicas
        value: 0

- it: minimal preset drops the jobs-worker AMQP consumer
  values:
    - ../examples/profiles/minimal.yaml
  template: ../templates/llamacloud/deployment.yaml
  asserts:
    - not: true
      containsDocument:
        any: true
        kind: Deployment
        apiVersion: apps/v1
        name: llamacloud-worker
        namespace: test-namespace

- it: minimal preset keeps parse+extract stack (backend, temporal parse, temporal jobs worker)
  values:
    - ../examples/profiles/minimal.yaml
  template: ../templates/llamacloud/deployment.yaml
  asserts:
    - containsDocument:
        any: true
        kind: Deployment
        apiVersion: apps/v1
        name: llamacloud
        namespace: test-namespace
    - containsDocument:
        any: true
        kind: Deployment
        apiVersion: apps/v1
        name: llamacloud-temporal-parse
        namespace: test-namespace
    - containsDocument:
        any: true
        kind: Deployment
        apiVersion: apps/v1
        name: temporal-jobs-worker
        namespace: test-namespace

- it: minimal preset mounts no store secrets anywhere
  values:
    - ../examples/profiles/minimal.yaml
  template: ../templates/llamacloud/deployment.yaml
  documentSelector:
    path: kind
    value: Deployment
    matchMany: true
  asserts:
    - notContains:
        path: spec.template.spec.containers[0].envFrom
        content:
          secretRef:
            name: mongodb-secret
    - notContains:
        path: spec.template.spec.containers[0].envFrom
        content:
          secretRef:
            name: rabbitmq-secret

# ---------------------------------------------------------------------------
# no-rabbitmq.yaml: AMQP off, MongoDB deliberately left on
# ---------------------------------------------------------------------------
- it: no-rabbitmq preset disables AMQP but keeps MongoDB
  values:
    - ../examples/profiles/no-rabbitmq.yaml
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - equal:
        path: .data.AMQP_DISABLED
        value: "true"
    # The whole point of this preset over minimal.yaml: v1 parse and Extract
    # still write job records to Mongo, so it must survive.
    - notExists:
        path: .data.MONGO_DISABLED

- it: no-rabbitmq preset does not need an index v1 transport override
  values:
    - ../examples/profiles/no-rabbitmq.yaml
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - notExists:
        path: .data.INDEX_V1_PIPELINE_SYNC_TEMPORAL_PERCENTAGE

- it: no-rabbitmq preset scales the v1 AMQP parse worker to zero
  values:
    - ../examples/profiles/no-rabbitmq.yaml
  template: ../templates/llamacloud/deployment.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud-parse
  asserts:
    - equal:
        path: spec.replicas
        value: 0

- it: no-rabbitmq preset drops the jobs-worker AMQP consumer but keeps the Temporal one
  values:
    - ../examples/profiles/no-rabbitmq.yaml
  template: ../templates/llamacloud/deployment.yaml
  asserts:
    - not: true
      containsDocument:
        any: true
        kind: Deployment
        apiVersion: apps/v1
        name: llamacloud-worker
        namespace: test-namespace
    - containsDocument:
        any: true
        kind: Deployment
        apiVersion: apps/v1
        name: temporal-jobs-worker
        namespace: test-namespace

- it: no-rabbitmq preset mounts the mongodb secret but not the rabbitmq one
  values:
    - ../examples/profiles/no-rabbitmq.yaml
  template: ../templates/llamacloud/deployment.yaml
  documentSelector:
    path: metadata.name
    value: llamacloud
  asserts:
    - contains:
        path: spec.template.spec.containers[0].envFrom
        content:
          secretRef:
            name: mongodb-secret
    - notContains:
        path: spec.template.spec.containers[0].envFrom
        content:
          secretRef:
            name: rabbitmq-secret

# ---------------------------------------------------------------------------
# full.yaml (must equal the default / no-overlay behavior)
# ---------------------------------------------------------------------------
- it: full preset injects no disable flags
  values:
    - ../examples/profiles/full.yaml
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - notExists:
        path: .data.MONGO_DISABLED
    - notExists:
        path: .data.AMQP_DISABLED

- it: full preset keeps the jobs-worker Deployment and mounts both store secrets
  values:
    - ../examples/profiles/full.yaml
  template: ../templates/llamacloud/deployment.yaml
  asserts:
    - containsDocument:
        any: true
        kind: Deployment
        apiVersion: apps/v1
        name: llamacloud-worker
        namespace: test-namespace
