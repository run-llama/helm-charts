suite: llamaparse-tests

templates:
- ../templates/llamacloud/configmaps/buckets.yaml
- ../templates/llamacloud/deployment.yaml
- ../templates/llamacloud/secret.yaml
- ../templates/llamacloud/configmap.yaml
- ../templates/monitoring/servicemonitor-components.yaml
- ../templates/llamacloud/hpa.yaml
- ../templates/llamacloud/pdb.yaml
- ../templates/llamacloud/service.yaml
- ../templates/llamacloud/serviceaccount.yaml

release:
  name: test-release
  namespace: test-namespace

capabilities:
  majorVersion: 1
  minorVersion: 31
  apiVersions:
    - apps/v1
    - monitoring.coreos.com/v1

chart:
  appVersion: 0.0.0

tests:
- it: should create bucket-config ConfigMap with parse buckets
  set:
    config.storageBuckets.parseFileUpload: test-s3-upload-bucket
    config.storageBuckets.parseFileOutput: test-s3-output-bucket
  templates:
    - ../templates/llamacloud/configmaps/buckets.yaml
  asserts:
    - isKind:
        of: ConfigMap
    - equal:
        path: .data.CLOUD_PROVIDER
        value: aws
    - equal:
        path: .data.S3_UPLOAD_BUCKET
        value: test-s3-upload-bucket
    - equal:
        path: .data.S3_OUTPUT_BUCKET
        value: test-s3-output-bucket

- it: does not create the retired parse Deployment
  set:
    monitoring.serviceMonitors.enabled: true
  template: ../templates/llamacloud/deployment.yaml
  asserts:
    - not: true
      containsDocument:
        any: true
        kind: Deployment
        apiVersion: apps/v1
        name: llamacloud-parse
        namespace: test-namespace

- it: does not create the retired parse Service
  set:
    monitoring.serviceMonitors.enabled: true
  template: ../templates/llamacloud/service.yaml
  asserts:
    - not: true
      containsDocument:
        any: true
        kind: Service
        apiVersion: v1
        name: llamacloud-parse
        namespace: test-namespace

- it: does not create the retired parse ServiceAccount
  set:
    monitoring.serviceMonitors.enabled: true
  template: ../templates/llamacloud/serviceaccount.yaml
  asserts:
    - not: true
      containsDocument:
        any: true
        kind: ServiceAccount
        apiVersion: v1
        name: llamacloud-parse
        namespace: test-namespace

- it: does not create the retired parse ConfigMap
  set:
    monitoring.serviceMonitors.enabled: true
  template: ../templates/llamacloud/configmap.yaml
  asserts:
    - not: true
      containsDocument:
        any: true
        kind: ConfigMap
        apiVersion: v1
        name: llamacloud-parse
        namespace: test-namespace

- it: does not create the retired parse Secret
  set:
    monitoring.serviceMonitors.enabled: true
  template: ../templates/llamacloud/secret.yaml
  asserts:
    - not: true
      containsDocument:
        any: true
        kind: Secret
        apiVersion: v1
        name: llamacloud-parse
        namespace: test-namespace

- it: does not create the retired parse HorizontalPodAutoscaler
  set:
    monitoring.serviceMonitors.enabled: true
  template: ../templates/llamacloud/hpa.yaml
  asserts:
    - not: true
      containsDocument:
        any: true
        kind: HorizontalPodAutoscaler
        apiVersion: autoscaling/v2
        name: llamacloud-parse
        namespace: test-namespace

- it: does not create the retired parse PodDisruptionBudget
  set:
    monitoring.serviceMonitors.enabled: true
  template: ../templates/llamacloud/pdb.yaml
  asserts:
    - not: true
      containsDocument:
        any: true
        kind: PodDisruptionBudget
        apiVersion: policy/v1
        name: llamacloud-parse
        namespace: test-namespace

- it: does not create the retired parse ServiceMonitor
  set:
    monitoring.serviceMonitors.enabled: true
  template: ../templates/monitoring/servicemonitor-components.yaml
  asserts:
    - not: true
      containsDocument:
        any: true
        kind: ServiceMonitor
        apiVersion: monitoring.coreos.com/v1
        name: llamacloud-parse
        namespace: test-namespace
