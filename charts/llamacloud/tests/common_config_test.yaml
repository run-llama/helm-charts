suite: common-config-tests

templates:
- ../templates/llamacloud/configmaps/common.yaml

release:
  name: test-release
  namespace: test-namespace

capabilities:
  majorVersion: 1
  minorVersion: 31
  apiVersions:
    - v1

chart:
  appVersion: 0.0.0

tests:
- it: always renders common-config ConfigMap with BYOC deployment markers
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - isKind:
        of: ConfigMap
    - equal:
        path: .metadata.name
        value: common-config
    - equal:
        path: .data.IS_DEPLOYED
        value: "true"
    - equal:
        path: .data.DEPLOYMENT_MODE
        value: "prod"
    - equal:
        path: .data.PARSE_PREMIUM
        value: "true"
    - equal:
        path: .data.ALLOWED_INDEX
        value: "true"

- it: routes all v1 parse through Temporal by default
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - equal:
        path: .data.V1_PARSE_VIA_TEMPORAL_PERCENTAGE
        value: "100"

- it: falls back to the AMQP transport when Temporal is disabled
  set:
    temporal:
      disabled: true
      deploy: false
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - equal:
        path: .data.V1_PARSE_VIA_TEMPORAL_PERCENTAGE
        value: "0"

- it: is scoped to release namespace
  release:
    namespace: my-ns
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - equal:
        path: .metadata.namespace
        value: my-ns

- it: leaves usage caps off and unset by default
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - equal:
        path: .data.USAGE_CAP_ENFORCEMENT_MODE
        value: "off"
    - notExists:
        path: .data.DEFAULT_DAILY_USAGE_CREDITS
    - notExists:
        path: .data.DEFAULT_MONTHLY_USAGE_CREDITS

- it: renders the configured usage cap mode and credit defaults
  set:
    config:
      usageCaps:
        enforcementMode: enforce
        defaultDailyCredits: 5000
        defaultMonthlyCredits: 100000
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - equal:
        path: .data.USAGE_CAP_ENFORCEMENT_MODE
        value: "enforce"
    - equal:
        path: .data.DEFAULT_DAILY_USAGE_CREDITS
        value: "5000"
    - equal:
        path: .data.DEFAULT_MONTHLY_USAGE_CREDITS
        value: "100000"

- it: renders a zero credit default rather than dropping it
  set:
    config:
      usageCaps:
        defaultDailyCredits: 0
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - equal:
        path: .data.DEFAULT_DAILY_USAGE_CREDITS
        value: "0"
