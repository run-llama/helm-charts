suite: common-config-tests

templates:
- ../templates/llamacloud/configmaps/common.yaml

release:
  name: test-release
  namespace: test-namespace

capabilities:
  majorVersion: 1
  minorVersion: 31
  apiVersions:
    - v1

chart:
  appVersion: 0.0.0

tests:
- it: always renders common-config ConfigMap with BYOC deployment markers
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - isKind:
        of: ConfigMap
    - equal:
        path: .metadata.name
        value: common-config
    - equal:
        path: .data.IS_DEPLOYED
        value: "true"
    - equal:
        path: .data.DEPLOYMENT_MODE
        value: "prod"

- it: does not emit retired index v1 transport dials
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - notExists:
        path: .data.INDEX_V1_PIPELINE_SYNC_TEMPORAL_PERCENTAGE
    - notExists:
        path: .data.INDEX_V1_DATA_SOURCE_UPDATE_TEMPORAL_PERCENTAGE
    - notExists:
        path: .data.INDEX_V1_FILE_UPDATER_TEMPORAL_PERCENTAGE
    - notExists:
        path: .data.INDEX_V1_DOCUMENT_INGEST_TEMPORAL_PERCENTAGE
    - notExists:
        path: .data.INDEX_V1_METADATA_UPDATE_TEMPORAL_PERCENTAGE
    - notExists:
        path: .data.INDEX_V1_LLAMA_PARSE_TRANSFORM_TEMPORAL_PERCENTAGE

- it: is scoped to release namespace
  release:
    namespace: my-ns
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - equal:
        path: .metadata.namespace
        value: my-ns

- it: leaves usage caps off and unset by default
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - equal:
        path: .data.USAGE_CAP_ENFORCEMENT_MODE
        value: "off"
    - notExists:
        path: .data.DEFAULT_DAILY_USAGE_CREDITS
    - notExists:
        path: .data.DEFAULT_MONTHLY_USAGE_CREDITS

- it: renders the configured usage cap mode and credit defaults
  set:
    config:
      usageCaps:
        enforcementMode: enforce
        defaultDailyCredits: 5000
        defaultMonthlyCredits: 100000
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - equal:
        path: .data.USAGE_CAP_ENFORCEMENT_MODE
        value: "enforce"
    - equal:
        path: .data.DEFAULT_DAILY_USAGE_CREDITS
        value: "5000"
    - equal:
        path: .data.DEFAULT_MONTHLY_USAGE_CREDITS
        value: "100000"

- it: renders a zero credit default rather than dropping it
  set:
    config:
      usageCaps:
        defaultDailyCredits: 0
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - equal:
        path: .data.DEFAULT_DAILY_USAGE_CREDITS
        value: "0"

- it: does not emit the retired extract transport dial
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - notExists:
        path: .data.TEMPORAL_EXTRACT_ROLLOUT_PERCENT

- it: leaves job limits unenforced by default
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - notExists:
        path: .data.JOB_SEMAPHORE_MODE
    - equal:
        path: .data.PROJECT_MAX_CONCURRENCY
        value: "100"

- it: enforces job limits when enableLimits is on
  set:
    config:
      jobs:
        enableLimits: true
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - equal:
        path: .data.JOB_SEMAPHORE_MODE
        value: "v2"
    - equal:
        path: .data.PROJECT_MAX_CONCURRENCY
        value: "100"

- it: carries a configured per-project job limit
  set:
    config:
      jobs:
        enableLimits: true
        maxConcurrentJobsPerProject: 4
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - equal:
        path: .data.PROJECT_MAX_CONCURRENCY
        value: "4"
    - equal:
        path: .data.JOB_SEMAPHORE_MODE
        value: "v2"

- it: leaves the spend read on the rollup by default
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - notExists:
        path: .data.USAGE_CAP_READ_FROM_ROLLUP

- it: reads spend directly when the rollup is turned off
  set:
    config:
      usageCaps:
        readFromRollup: false
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - equal:
        path: .data.USAGE_CAP_READ_FROM_ROLLUP
        value: "false"

- it: leaves the execution-time gate on the cached read by default
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - notExists:
        path: .data.USAGE_CAP_EXECUTION_GATE_SKIP_CACHE

- it: reads spend uncached at the execution-time gate when asked
  set:
    config:
      usageCaps:
        executionGateSkipCache: true
  template: ../templates/llamacloud/configmaps/common.yaml
  asserts:
    - equal:
        path: .data.USAGE_CAP_EXECUTION_GATE_SKIP_CACHE
        value: "true"
