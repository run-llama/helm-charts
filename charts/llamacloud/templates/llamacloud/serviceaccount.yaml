{{- range $name, $component := ((include "llamacloud.components" .) | fromYaml ) }}
{{- $componentPrefix := $component.prefix }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ print $component.name | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{ include "llamacloud.labels" (dict "name" $component.name "root" $) | indent 4 }}
  annotations: {{ include "llamacloud.annotations" (dict "component" $component "root" $) | indent 4 }}
    {{- $serviceAccountAnnotations := deepCopy ($component.serviceAccountAnnotations | default dict) }}
    {{- if and $component.usesS3 (include "llamacloud.s3proxy.azureWorkloadIdentity" $) }}
    {{- /* merge keeps a client-id the component's serviceAccountAnnotations already set. */}}
    {{- $serviceAccountAnnotations = merge $serviceAccountAnnotations (dict "azure.workload.identity/client-id" $.Values.config.storageBuckets.s3proxy.azureWorkloadIdentity.clientId) }}
    {{- end }}
    {{- if $serviceAccountAnnotations }}
    {{- $serviceAccountAnnotations | toYaml | nindent 4 }}
    {{- end }}
{{- end }}