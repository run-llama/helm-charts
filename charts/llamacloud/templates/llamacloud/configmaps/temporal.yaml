{{- $temporalHost := include "llamacloud.temporal.host" . }}
{{- $temporalPort := include "llamacloud.temporal.port" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-connection-config
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{ include "llamacloud.labels" (dict "root" $) | indent 4 }}
  annotations: {{ include "llamacloud.annotations" (dict "root" $) | indent 4 }}
data:
  TEMPORAL_HOST: {{ $temporalHost | quote }}
  TEMPORAL_PORT: {{ $temporalPort | quote }}
  TEMPORAL_NAMESPACE: {{ ((.Values.config).temporal).namespace | default $.Release.Namespace | quote }}
  TEMPORAL_WORKER_REGISTRY_PROFILE: {{ ((.Values.config).temporal).workerRegistryProfile | default "consolidated" | quote }}
  TEMPORAL_EXTERNAL_PAYLOAD_STORAGE_ENABLED: {{ (((.Values.config).temporal).externalPayloadStorage).enabled | default false | quote }}
{{- with (((.Values.config).temporal).externalPayloadStorage).bucketName }}
  TEMPORAL_EXTERNAL_PAYLOAD_STORAGE_BUCKET_NAME: {{ . | quote }}
{{- end }}
{{- with (((.Values.config).temporal).externalPayloadStorage).thresholdBytes }}
  TEMPORAL_EXTERNAL_PAYLOAD_STORAGE_THRESHOLD_BYTES: {{ . | quote }}
{{- end }}
