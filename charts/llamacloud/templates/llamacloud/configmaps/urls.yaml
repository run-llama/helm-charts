{{- $layoutComponent := dict }}
{{- if (((.Values.config).parseLayoutDetectionV3).enabled) }}
{{- $layoutComponent = include "llamacloud.component.llamaParseLayoutDetectionApiV3" $ | fromYaml }}
{{- else if (((.Values.config).parseLayoutDetection).enabled) }}
{{- $layoutComponent = include "llamacloud.component.llamaParseLayoutDetectionApi" $ | fromYaml }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: urls-config
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{ include "llamacloud.labels" (dict "root" $) | indent 4 }}
  annotations: {{ include "llamacloud.annotations" (dict "root" $) | indent 4 }}
data:
  JOB_SERVICE_URL: {{ printf "http://%s:%d" (include "llamacloud.component.jobsService" $ | fromYaml).name ( "80" | int) | quote }}
  TRACKING_SERVICE_URL: {{ printf "http://%s:%d" (include "llamacloud.component.usage" $ | fromYaml).name ( "80" | int) | quote }}
  # BACKEND_URL is the in-cluster backend Service URL. It is consumed only by
  # server-side code (SSR outbound fetches and the /api /deployments proxy
  # route handlers). Browser-destined URLs read PUBLIC_BACKEND_URL instead.
  BACKEND_URL: {{ printf "http://%s:%d" (include "llamacloud.component.backend" $ | fromYaml).name ( "80" | int) | quote }}
  {{- if ($.Values.ingress).host }}
  LLAMACLOUD_INGRESS_URL: {{ print (include "llamacloud.ingress.scheme" .) "://" (.Values.ingress).host | quote }}
  {{- end }}
  {{- if ($.Values.ingress).host }}
  PUBLIC_BACKEND_URL: {{ print (include "llamacloud.ingress.scheme" .) "://" (.Values.ingress).host | quote }}
  {{- end }}
  {{- if ($.Values.ingress).host }}
  # Self-hosted deployments serve the UI from the same host as the API. Without this the
  # backend's frontend-URL lookup falls back to the deployment-mode map, which points at the
  # hosted product, so post-login/registration redirects would leave the customer's own
  # deployment. Customer-configured auth supplies its own FRONTEND_URL via a Secret, which is
  # attached after this ConfigMap in envFrom and therefore still wins.
  FRONTEND_URL: {{ print (include "llamacloud.ingress.scheme" .) "://" (.Values.ingress).host | quote }}
  {{- end }}
  AGENT_DEPLOYMENT_USE_PUBLIC_BACKEND_URL: {{ .Values.llamaAgents.useBackendPublicUrl | quote }}
  {{- if (((.Values.config).storageBuckets).s3proxy.enabled | default false) }}
  S3_ENDPOINT_URL: {{ printf "http://localhost:%d" (int ((($.Values.config).storageBuckets).s3proxy.containerPort | default 80)) | quote }}
  {{- end }}
  {{- /* Each gateway route's bearer is the gateway key, set in the parse worker env under
         the same setting by llamacloud.managedInference.parseTokenNames. */}}
  {{- $gateway := include "llamacloud.managedInference.url" . }}
  {{- if (((.Values.config).parseOcr).enabled) }}
  {{- if $gateway }}
  OCR_SERVICE_ENDPOINT: {{ printf "%s/ocr" $gateway | quote }}
  NON_GRANULAR_OCR_SERVICE_ENDPOINT_V2: {{ printf "%s/ocr/non-granular" $gateway | quote }}
  {{- else }}
  OCR_SERVER_URL: {{ printf "http://%s:%d/ocr" (include "llamacloud.component.llamaParseOcr" $ | fromYaml).name ( "80" | int) | quote }}
  {{- end }}
  {{- end }}
  {{- if (((.Values.config).parseFormFieldDetection).enabled) }}
  {{- if $gateway }}
  FFDETR_MODAL_ENDPOINT: {{ printf "%s/ffdetr/predict" $gateway | quote }}
  {{- else }}
  FFDETR_ENDPOINT: {{ printf "http://%s:%d" (include "llamacloud.component.llamaParseFormFieldDetectionApi" $ | fromYaml).name ( "80" | int) | quote }}
  {{- end }}
  {{- /* The endpoint alone runs the detector; this attaches the detected boxes to the
         form fields. Costs an overlay image per form-page LLM call; override in the
         parse component's extraEnvVariables, which outranks this ConfigMap. */}}
  FORM_BBOX_ATTRIBUTION: "model_overlay"
  {{- end }}
  {{- if $layoutComponent.name }}
  {{- if $gateway }}
  {{- /* The gateway serves predict at /layout/, trailing slash included, and batch at
         /layout/batch, which the worker derives from this value. */}}
  LAYOUT_EXTRACTION_V3_MODAL_ENDPOINT: {{ printf "%s/layout/" $gateway | quote }}
  {{- else }}
  LAYOUT_EXTRACTION_V3_ENDPOINT: {{ printf "http://%s:%d" $layoutComponent.name ( "80" | int) | quote }}
  {{- end }}
  # Match Modal SaaS detector input resolution. Operators can override through
  # worker environment when running an explicit A/B.
  LAYOUT_IMAGE_SIZE: "736"
  {{- end }}
