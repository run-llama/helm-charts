apiVersion: v1
kind: ConfigMap
metadata:
  name: common-config
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{ include "llamacloud.labels" (dict "root" $) | indent 4 }}
  annotations: {{ include "llamacloud.annotations" (dict "root" $) | indent 4 }}
data:
  IS_DEPLOYED: "true"
  DEPLOYMENT_MODE: "prod"
  PARSE_PREMIUM: "true"
  ALLOWED_INDEX: "true"
  ## Parse v1 dispatch transport. 100 runs every v1 parse job as a Temporal
  ## parse-job-workflow; 0 keeps the legacy RabbitMQ publish, which is the only
  ## transport left when Temporal (and with it the parse workers) is switched off.
  V1_PARSE_VIA_TEMPORAL_PERCENTAGE: {{ ternary "0" "100" .Values.temporal.disabled | quote }}
{{- if not (.Values.mongodb).enabled }}
  MONGO_DISABLED: "true"
{{- end }}
{{- if not (.Values.rabbitmq).enabled }}
  AMQP_DISABLED: "true"
{{- end }}
{{- if not ((.Values.config).v1).enabled }}
  V1_ENABLED: "false"
{{- end }}