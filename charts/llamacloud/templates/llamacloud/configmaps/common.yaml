apiVersion: v1
kind: ConfigMap
metadata:
  name: common-config
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{ include "llamacloud.labels" (dict "root" $) | indent 4 }}
  annotations: {{ include "llamacloud.annotations" (dict "root" $) | indent 4 }}
data:
  IS_DEPLOYED: "true"
  DEPLOYMENT_MODE: "prod"
{{- if not (.Values.mongodb).enabled }}
  MONGO_DISABLED: "true"
{{- end }}
{{- if not (.Values.rabbitmq).enabled }}
  AMQP_DISABLED: "true"
{{- end }}
{{- if not ((.Values.config).v1).enabled }}
  V1_ENABLED: "false"
{{- end }}
{{- with (((.Values.config).usageCaps).enforcementMode) }}
  USAGE_CAP_ENFORCEMENT_MODE: {{ . | quote }}
{{- end }}
{{- if not (kindIs "invalid" (((.Values.config).usageCaps).defaultDailyCredits)) }}
  DEFAULT_DAILY_USAGE_CREDITS: {{ ((.Values.config).usageCaps).defaultDailyCredits | quote }}
{{- end }}
{{- if not (kindIs "invalid" (((.Values.config).usageCaps).defaultMonthlyCredits)) }}
  DEFAULT_MONTHLY_USAGE_CREDITS: {{ ((.Values.config).usageCaps).defaultMonthlyCredits | quote }}
{{- end }}
{{- if ((.Values.config).jobs).enableLimits }}
  ## The switch picks which semaphore admits a job. The limits are quota
  ## defaults and render either way, since they mean nothing until this is on.
  JOB_SEMAPHORE_MODE: "v2"
{{- end }}
{{- if not (kindIs "invalid" (((.Values.config).jobs).maxConcurrentJobsPerProject)) }}
  PROJECT_MAX_CONCURRENCY: {{ ((.Values.config).jobs).maxConcurrentJobsPerProject | quote }}
{{- end }}
{{- if not (kindIs "invalid" (((.Values.config).usageCaps).readFromRollup)) }}
  USAGE_CAP_READ_FROM_ROLLUP: {{ ((.Values.config).usageCaps).readFromRollup | quote }}
{{- end }}
{{- if not (kindIs "invalid" (((.Values.config).usageCaps).executionGateSkipCache)) }}
  USAGE_CAP_EXECUTION_GATE_SKIP_CACHE: {{ ((.Values.config).usageCaps).executionGateSkipCache | quote }}
{{- end }}
