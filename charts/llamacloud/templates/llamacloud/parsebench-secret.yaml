{{- if and .Values.parsebench.enabled (not .Values.parsebench.apiKeySecretName) .Values.parsebench.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-parsebench
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{ include "llamacloud.labels" (dict "root" $) | indent 4 }}
  annotations: {{ include "llamacloud.annotations" (dict "root" $) | indent 4 }}
type: Opaque
stringData:
  LLAMA_CLOUD_API_KEY: {{ .Values.parsebench.apiKey | quote }}
{{- end }}
