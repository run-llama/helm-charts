{{- if not ((.Values.config).defaultIndex).secret }}
{{- $mongo := (((.Values.config).defaultIndex).mongo) | default dict }}
{{- $tpuf := (((.Values.config).defaultIndex).turbopuffer) | default dict }}
{{- $pg := (((.Values.config).defaultIndex).postgres) | default dict }}
{{- /* The postgres block activates when the default destination is "postgres" or
       config.defaultIndex.postgres.host is set (mirrored by the envFrom helper in
       _defaults/_secrets.tpl). Fields left empty inherit the platform postgresql.*
       values, so inline-credential deployments (including the minimal profile) get
       a working postgres vector store with no extra values. */}}
{{- $pgEnabled := or (eq ((((.Values.config).defaultIndex).destination) | default "") "postgres") $pg.host }}
{{- $pgHost := $pg.host | default (.Values.postgresql).host }}
{{- $pgPort := $pg.port | default (.Values.postgresql).port | default "5432" }}
{{- $pgDatabase := $pg.database | default (.Values.postgresql).database }}
{{- $pgUsername := $pg.username | default (.Values.postgresql).username }}
{{- $pgPassword := $pg.password | default (.Values.postgresql).password }}
{{- if or $mongo.uri $mongo.db $mongo.collection $tpuf.apiKey $pgEnabled }}
{{- if or $mongo.uri $mongo.db $mongo.collection }}
  {{- if not (and $mongo.uri $mongo.db $mongo.collection) }}
  {{- fail "config.defaultIndex.mongo requires uri, db, and collection to all be set" }}
  {{- end }}
{{- end }}
{{- if $pgEnabled }}
  {{- if not (and $pgHost $pgDatabase $pgUsername $pgPassword) }}
  {{- fail "the postgres index destination requires host, database, username, and password — set config.defaultIndex.postgres.* (inherited from inline postgresql.* values when those are set; an existing postgresql.secret cannot be inherited), or provide config.defaultIndex.secret" }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: default-index-secret
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{ include "llamacloud.labels" (dict "root" $) | indent 4 }}
  annotations: {{ include "llamacloud.annotations" (dict "root" $) | indent 4 }}
data:
  {{- if $mongo.uri }}
  DEFAULT_INDEX_MONGO_URI: {{ $mongo.uri | b64enc | quote }}
  DEFAULT_INDEX_MONGO_DB: {{ $mongo.db | b64enc | quote }}
  DEFAULT_INDEX_MONGO_COLLECTION: {{ $mongo.collection | b64enc | quote }}
  {{- end }}
  {{- if $tpuf.apiKey }}
  DEFAULT_INDEX_TPUF_API_KEY: {{ $tpuf.apiKey | b64enc | quote }}
  {{- if $tpuf.region }}
  DEFAULT_INDEX_TPUF_REGION: {{ $tpuf.region | b64enc | quote }}
  {{- end }}
  {{- if $tpuf.namespacePrefix }}
  DEFAULT_INDEX_TPUF_NAMESPACE_PREFIX: {{ $tpuf.namespacePrefix | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if $pgEnabled }}
  DEFAULT_INDEX_PG_HOST: {{ $pgHost | b64enc | quote }}
  DEFAULT_INDEX_PG_PORT: {{ $pgPort | toString | b64enc | quote }}
  DEFAULT_INDEX_PG_NAME: {{ $pgDatabase | b64enc | quote }}
  DEFAULT_INDEX_PG_USER: {{ $pgUsername | b64enc | quote }}
  DEFAULT_INDEX_PG_PASSWORD: {{ $pgPassword | toString | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
