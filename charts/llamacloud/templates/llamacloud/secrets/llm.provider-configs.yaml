apiVersion: v1
kind: Secret
metadata:
  name: llm-provider-configs-secret
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{ include "llamacloud.labels" (dict "root" $) | indent 4 }}
  annotations: {{ include "llamacloud.annotations" (dict "root" $) | indent 4 }}
{{- $llms := (.Values.config).llms | default dict }}
{{- $document := $llms.providerConfigs | default list }}
{{- /* A non-empty modelPolicy switches the payload to the object form the resolver also accepts. */}}
{{- if $llms.modelPolicy }}
{{-   $document = dict "providerConfigs" $document "modelPolicy" $llms.modelPolicy }}
{{- end }}
data:
  LLM_PROVIDER_CONFIGS_JSON: {{ $document | toJson | b64enc | quote }}
