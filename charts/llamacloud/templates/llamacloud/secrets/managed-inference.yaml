{{- if include "llamacloud.managedInference.url" . }}
{{- include "llamacloud.managedInference.validate" . }}
{{- if not .Values.config.managedInference.secret }}
apiVersion: v1
kind: Secret
metadata:
  name: managed-inference-secret
  namespace: {{ $.Release.Namespace | quote }}
  labels: {{ include "llamacloud.labels" (dict "root" $) | indent 4 }}
  annotations: {{ include "llamacloud.annotations" (dict "root" $) | indent 4 }}
data:
  MANAGED_INFERENCE_GATEWAY_API_KEY: {{ .Values.config.managedInference.apiKey | b64enc | quote }}
{{- end }}
{{- end }}
