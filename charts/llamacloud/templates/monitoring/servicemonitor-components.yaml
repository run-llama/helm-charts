{{- if .Values.monitoring.serviceMonitors.enabled }}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
{{- /*
  The components helper filters out disabled services.
*/}}
{{- $monitored := list "backend" "jobsService" "llamaParseOcr" "usage" "llamaParseLayoutDetectionApi" "llamaParseLayoutDetectionApiV3" "temporalLlamaParse" "temporalLlamaParseQuarantine" }}
{{- range $name, $component := ((include "llamacloud.components" .) | fromYaml) }}
{{- if or (has $name $monitored) (hasKey $.Values.temporalWorkloads.workers $name) }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $component.name | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    release: {{ $.Values.monitoring.serviceMonitors.release | quote }}
spec:
  namespaceSelector:
    matchNames:
      - {{ $.Release.Namespace | quote }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}
      app.kubernetes.io/name: {{ $component.name | quote }}
      app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $.Values.monitoring.serviceMonitors.interval | quote }}
      scrapeTimeout: {{ $.Values.monitoring.serviceMonitors.scrapeTimeout | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
