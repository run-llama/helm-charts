# Example: back LlamaCloud's file storage with Azure Blob Storage via the S3Proxy sidecar.
# LlamaCloud speaks S3 natively; S3Proxy translates those calls for non-S3 backends.
#
# S3Proxy is gated ONLY on config.storageBuckets.s3proxy.enabled. `provider` does not
# switch it on or off; it only sets the CLOUD_PROVIDER env var. Enable S3Proxy for any
# non-AWS backend (Azure Blob, GCS, MinIO and other S3-compatible stores) and for AWS
# when you authenticate with access keys instead of IRSA.

license:
  key: "<REPLACE-WITH-LLAMACLOUD-LICENSE-KEY>"

# Connection details for required services
postgresql:
  host: "<REPLACE-WITH-POSTGRESQL-HOST>"
  port: "5432"
  database: "<REPLACE-WITH-DATABASE-NAME>"
  username: "<REPLACE-WITH-USERNAME>"
  password: "<REPLACE-WITH-PASSWORD>"
  # secret: "<uncomment-if-using-existing-secret>"

mongodb:
  host: "<REPLACE-WITH-MONGODB-HOST>"
  port: "27017"
  username: "<REPLACE-WITH-USERNAME>"
  password: "<REPLACE-WITH-PASSWORD>"
  # secret: "<uncomment-if-using-existing-secret>"

rabbitmq:
  host: "<REPLACE-WITH-RABBITMQ-HOST>"
  port: "5672"
  username: "<REPLACE-WITH-USERNAME>"
  password: "<REPLACE-WITH-PASSWORD>"
  # secret: "<uncomment-if-using-existing-secret>"

redis:
  host: "<REPLACE-WITH-REDIS-HOST>"
  port: "6379"
  password: "<REPLACE-WITH-PASSWORD>"
  # secret: "<uncomment-if-using-existing-secret>"

# For more information on S3Proxy configuration, see:
# https://github.com/gaul/s3proxy

config:
  storageBuckets:
    provider: "azure"  # or "gcp"; sets CLOUD_PROVIDER, does not gate the sidecar

    s3proxy:
      # Required. This, and only this, deploys the sidecar.
      enabled: true
      containerPort: 8080

      # Backend credentials. For other backends see:
      # https://github.com/gaul/s3proxy/wiki/Storage-backend-examples
      config:
        JCLOUDS_PROVIDER: "azureblob"
        JCLOUDS_AZUREBLOB_AUTH: "azureKey"
        JCLOUDS_IDENTITY: "<REPLACE-WITH-STORAGE-ACCOUNT-NAME>"
        JCLOUDS_CREDENTIAL: "<REPLACE-WITH-STORAGE-ACCOUNT-KEY>"
        # Optional. Defaults to https://<identity>.blob.core.windows.net; set it
        # only for a sovereign cloud or a custom storage endpoint.
        # JCLOUDS_ENDPOINT: "<REPLACE-WITH-STORAGE-ACCOUNT-ENDPOINT>"
        # Optional. Not used by the azureblob backend.
        # JCLOUDS_REGION: "<REPLACE-WITH-REGION>"
        # The S3PROXY_* listener settings (endpoint, authorization, CORS,
        # unknown-header handling) are set by the chart; override only if needed.
