# Minimal deployment profile: parse + extract only, NO MongoDB and NO RabbitMQ.
#
# Layer this file on top of your base values (connection details, license,
# LLMs, auth), e.g.:
#   helm install llamacloud . -f my-values.yaml -f examples/profiles/minimal.yaml
#
# What this profile does:
#   - mongodb.enabled=false / rabbitmq.enabled=false: no store secrets are
#     rendered or mounted, MONGO_DISABLED/AMQP_DISABLED are injected, and the
#     jobs-worker (AMQP consumer) Deployment is not created. Do NOT install
#     MongoDB or RabbitMQ for this profile, and omit their connection values.
#   - llamaParse.replicas=0: the v1 AMQP parse worker has no queue to consume;
#     parse runs through the Temporal worker (llamacloud-temporal-parse).
#   - Default index destination pinned to postgres so nothing resolves to the
#     legacy mongodb export destination. The postgres vector store
#     (DEFAULT_INDEX_PG_*) inherits the inline postgresql.* values; the
#     database user must be able to CREATE EXTENSION vector (pgvector must be
#     installed on the PostgreSQL server).
#
# Feature surface under this profile:
#   - Parse v2 and Extract v2 work end to end (Temporal + PostgreSQL + Redis).
#   - Index (directory) sync, export, retrieval, and chat run against the
#     postgres (pgvector) destination.
#   - v1 parse, pipelines, retrieval over pipeline documents, and mongodb
#     index export return cause-coded 4xx errors instead of hanging.
#
# Requires an app version with MONGO_DISABLED / AMQP_DISABLED support.

mongodb:
  enabled: false

rabbitmq:
  enabled: false

llamaParse:
  replicas: 0

config:
  defaultIndex:
    destination: postgres
